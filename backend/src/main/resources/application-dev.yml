# Perfil de desenvolvimento — H2 em MEMÓRIA.
# Em memória evita qualquer trava de arquivo: se um servidor antigo ficar
# rodando, o novo sobe do mesmo jeito. Os dados somem ao desligar, mas o
# seed recria tudo a cada boot.
spring:
  datasource:
    url: jdbc:h2:mem:lktransportes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    # Em dev o schema vem do Hibernate (create-drop); as migrações são de produção.
    enabled: false

lk:
  h2-console-liberado: true
