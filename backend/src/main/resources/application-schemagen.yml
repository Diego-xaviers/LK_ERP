# Perfil de uso único: gera o DDL PostgreSQL a partir das entidades e sai.
# Não conecta em Postgres — o dialeto é forçado só para a geração do script.
spring:
  datasource:
    url: jdbc:h2:mem:schemagen;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      jakarta.persistence.schema-generation.scripts.action: create
      jakarta.persistence.schema-generation.scripts.create-target: target/schema-postgres.sql
      jakarta.persistence.schema-generation.create-source: metadata
      jakarta.persistence.schema-generation.scripts.create-database-schemas: false
